name: Temporary review source snapshot

on:
  push:
    branches: [review/market-observability-2026-09-16]
    paths: [.github/workflows/review-snapshot.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b214ca8aa0d9d640595b8e42646d5f335ac30328
          persist-credentials: false
      - name: Archive only tracked public source at the audited base
        run: |
          mkdir -p "$RUNNER_TEMP/review-source"
          git archive --format=zip --output="$RUNNER_TEMP/review-source/source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/review-source/BASE_SHA.txt"
          sha256sum "$RUNNER_TEMP/review-source/source.zip" > "$RUNNER_TEMP/review-source/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-public-review-source
          path: ${{ runner.temp }}/review-source/
          retention-days: 1
          if-no-files-found: error
