name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-regressions:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-ci.lock
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes -r requirements-ci.lock
      - name: Compile
        run: >-
          python -m compileall -q
          export_for_gemini.py openinsider_agent.py signals.py timeutil.py
          stateutil.py marketbot.py universe_profile.py brief_tools.py diagnostics.py session_returns.py agents ledger scripts
      - name: Validate synthetic export schema
        run: python scripts/validate_export_schema.py
      - name: Run deterministic offline regressions
        run: python scripts/run_offline_checks.py --report review-results/offline.json
      - name: Check dashboard JavaScript syntax
        run: node --check dashboard/app.js
      - name: Check dashboard transport on loopback with synthetic data
        run: python -m unittest -v test_dashboard_server test_dashboard_security
        timeout-minutes: 2
      - name: Retain offline check receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-${{ matrix.os }}-py${{ matrix.python-version }}
          path: review-results/offline.json
          if-no-files-found: warn
          retention-days: 14

  security:
    name: Dependency and secret scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install hash-locked CI tools
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Audit runtime dependencies
        run: pip-audit --strict --require-hashes -r requirements.lock
      - name: Validate baseline and scan tracked files for secrets
        run: python scripts/run_secret_scan.py
