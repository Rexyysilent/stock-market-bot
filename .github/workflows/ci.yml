name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-regressions:
    name: Python ${{ matrix.python-version }} offline checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-ci.lock
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes -r requirements-ci.lock
      - name: Compile
        run: >-
          python -m compileall -q
          export_for_gemini.py openinsider_agent.py signals.py timeutil.py
          stateutil.py agents ledger scripts
      - name: Validate synthetic export schema
        run: python scripts/validate_export_schema.py
      - name: Run deterministic offline regressions
        run: python scripts/run_offline_checks.py

  security:
    name: Dependency and secret scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install hash-locked CI tools
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Audit runtime dependencies
        run: pip-audit --strict --require-hashes -r requirements.lock
      - name: Scan tracked files for secrets
        run: python scripts/run_secret_scan.py
